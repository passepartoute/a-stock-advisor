<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Stock 报告查看器</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fa;
      --fg: #1f2328;
      --link: #0969da;
      --border: #d1d9e0;
      --code-bg: #f0f2f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #c9d1d9;
        --link: #58a6ff;
        --border: #30363d;
        --code-bg: #161b22;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    header a {
      color: var(--link);
      text-decoration: none;
      font-size: 14px;
    }
    header a:hover {
      text-decoration: underline;
    }
    header span {
      font-size: 14px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .loading, .error {
      padding: 40px 0;
      text-align: center;
      color: #8b949e;
    }
    .error {
      color: #cf222e;
    }
    /* Markdown styles */
    main h1, main h2, main h3, main h4 {
      margin-top: 32px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.25;
    }
    main h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    main h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    main h3 { font-size: 1.25em; }
    main p { margin: 0 0 12px; }
    main a { color: var(--link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main ul, main ol { padding-left: 24px; margin: 0 0 12px; }
    main li { margin: 4px 0; }
    main code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
      font-size: 0.9em;
    }
    main pre {
      background: var(--code-bg);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 16px;
    }
    main pre code { padding: 0; background: none; }
    main table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 0.9em;
    }
    main th, main td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    main th {
      background: var(--code-bg);
      font-weight: 600;
    }
    main tr:nth-child(even) { background: rgba(128,128,128,0.03); }
    main blockquote {
      margin: 0 0 12px;
      padding: 0 16px;
      color: #8b949e;
      border-left: 4px solid var(--border);
    }
    main hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← 返回首页</a>
    <span id="filename"></span>
  </header>
  <main id="content">
    <div class="loading">正在加载报告...</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const report = params.get('report');
    const contentEl = document.getElementById('content');
    const filenameEl = document.getElementById('filename');

    if (!report) {
      contentEl.innerHTML = '<div class="error">缺少 report 参数，请从首页选择报告。</div>';
    } else {
      filenameEl.textContent = report;
      fetch(report)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
          return r.text();
        })
        .then(md => {
          contentEl.innerHTML = marked.parse(md);
        })
        .catch(err => {
          contentEl.innerHTML = `<div class="error">加载失败：${err.message}</div>`;
        });
    }
  </script>
</body>
</html>
