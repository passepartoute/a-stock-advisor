name: Generate A-Stock Report

on:
  # 每个 A 股交易日北京时间 09:00 自动生成日报（UTC 01:00，周一到周五）
  schedule:
    - cron: '0 1 * * 1-5'

  # 外部 API 触发（手机/网页/脚本）
  repository_dispatch:
    types: [daily-report, backtest-report]

  # GitHub 网页手动触发
  workflow_dispatch:
    inputs:
      report_type:
        description: '报告类型'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backtest
      backtest_month:
        description: '回测月份（如 2026-05）'
        required: false
        default: ''
        type: string

# GitHub Actions 部署需要的顶层权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup tushare token
        run: |
          mkdir -p config
          echo "${{ secrets.TUSHARE_TOKEN }}" > config/.tushare_token

      - name: Setup Moonshot API key
        run: |
          mkdir -p config
          echo "${{ secrets.MOONSHOT_API_KEY }}" > config/.llm_api_key

      - name: Generate daily report
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'daily-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily')
        run: |
          python main.py

      - name: Generate backtest report
        if: |
          (github.event_name == 'repository_dispatch' && github.event.action == 'backtest-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backtest')
        env:
          BACKTEST_MONTH: ${{ github.event.client_payload.month || github.event.inputs.backtest_month }}
        run: |
          if [ -n "$BACKTEST_MONTH" ]; then
            python backtest.py --month "$BACKTEST_MONTH"
          else
            python backtest.py
          fi

      - name: List output files
        run: |
          echo "Generated files:"
          find reports/output -type f -name "*.md" 2>/dev/null || true

      - name: Generate Pages index
        run: |
          mkdir -p reports/output
          REPORTS=$(find reports/output -maxdepth 1 -name '*.md' -printf '%f\n' | sort -r)
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="zh-CN">'
            echo '<head><meta charset="UTF-8"><title>A-Stock 报告</title></head>'
            echo '<body>'
            echo '<h1>A-Stock 每日选股报告</h1>'
            echo '<ul>'
            for f in $REPORTS; do
              echo "<li><a href=\"$f\">$f</a></li>"
            done
            echo '</ul>'
            echo '<p>自动生成于 ${{ github.run_started_at }}</p>'
            echo '</body></html>'
          } > reports/output/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports/output

      # 可选：邮件通知（需要配置 EMAIL_USERNAME 和 EMAIL_PASSWORD secrets）
      - name: Send email notification
        if: env.EMAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "A-Stock 报告已生成"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: github-actions@example.com
          body: |
            报告已生成完成。

            在线查看：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            Artifact 下载：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
