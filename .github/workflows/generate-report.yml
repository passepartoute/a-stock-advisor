name: Generate A-Stock Report

on:
  # 外部 API 触发（手机/网页/脚本）
  repository_dispatch:
    types: [daily-report, backtest-report]

  # GitHub 网页手动触发
  workflow_dispatch:
    inputs:
      report_type:
        description: '报告类型'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backtest
      backtest_month:
        description: '回测月份（如 2026-05）'
        required: false
        default: ''
        type: string

# gh-pages 分支部署需要写入仓库内容权限
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # CI 环境下使用 data_source: auto，自动在 akshare / tushare / mock 之间降级，提高稳定性
      DATA_SOURCE: auto
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup tushare token
        run: |
          mkdir -p config
          echo "${{ secrets.TUSHARE_TOKEN }}" > config/.tushare_token

      - name: Setup Moonshot API key
        run: |
          mkdir -p config
          echo "${{ secrets.MOONSHOT_API_KEY }}" > config/.llm_api_key

      - name: Generate daily report
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'daily-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily')
        run: |
          python main.py

      - name: Generate backtest report
        if: |
          (github.event_name == 'repository_dispatch' && github.event.action == 'backtest-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backtest')
        env:
          BACKTEST_MONTH: ${{ github.event.client_payload.month || github.event.inputs.backtest_month }}
        run: |
          if [ -n "$BACKTEST_MONTH" ]; then
            python backtest.py --month "$BACKTEST_MONTH"
          else
            python backtest.py
          fi

      - name: List output files
        run: |
          echo "Generated files:"
          find reports/output -type f -name "*.md" 2>/dev/null || true

      - name: Copy markdown viewer
        run: |
          cp viewer.html reports/output/viewer.html

      - name: Checkout existing gh-pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages-src
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Prepare site directory
        run: |
          mkdir -p _site
          if [ -d "_pages-src" ]; then
            cp -a _pages-src/. _site/
            rm -rf _site/.git
          fi
          cp -f reports/output/*.md _site/ 2>/dev/null || true
          cp -f viewer.html _site/viewer.html
          touch _site/.nojekyll

      - name: Prune reports older than 7 days
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d)
          echo "Cutoff date: $CUTOFF"
          for f in _site/*.md; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            if [[ "$b" =~ ^report_([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]]; then
              fdate="${BASH_REMATCH[1]}"
            elif [[ "$b" =~ ^(backtest|avoid_list)_([0-9]{4})([0-9]{2})([0-9]{2})\.md$ ]]; then
              fdate="${BASH_REMATCH[2]}-${BASH_REMATCH[3]}-${BASH_REMATCH[4]}"
            else
              echo "  skip unrecognized: $b"
              continue
            fi
            if [[ "$fdate" < "$CUTOFF" ]]; then
              rm -f "$f"
              echo "  pruned $b ($fdate)"
            fi
          done

      - name: Generate Pages index
        run: |
          python3 .github/scripts/generate_pages_index.py _site --days 7

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false

      # 可选：邮件通知（需要配置 EMAIL_USERNAME 和 EMAIL_PASSWORD secrets）
      - name: Send email notification
        if: env.EMAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "A-Stock 报告已生成"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: github-actions@example.com
          body: |
            报告已生成完成。

            在线查看：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            运行日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
