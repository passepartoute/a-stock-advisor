name: Generate A-Stock Report

on:
  # 每个 A 股交易日北京时间 09:00 自动生成日报（UTC 01:00，周一到周五）
  schedule:
    - cron: '0 1 * * 1-5'

  # 外部 API 触发（手机/网页/脚本）
  repository_dispatch:
    types: [daily-report, backtest-report]

  # GitHub 网页手动触发
  workflow_dispatch:
    inputs:
      report_type:
        description: '报告类型'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backtest
      backtest_month:
        description: '回测月份（如 2026-05）'
        required: false
        default: ''
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup tushare token
        run: |
          mkdir -p config
          echo "${{ secrets.TUSHARE_TOKEN }}" > config/.tushare_token

      - name: Setup Moonshot API key
        run: |
          mkdir -p config
          echo "${{ secrets.MOONSHOT_API_KEY }}" > config/.llm_api_key

      - name: Generate daily report
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'daily-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily')
        run: |
          python main.py

      - name: Generate backtest report
        if: |
          (github.event_name == 'repository_dispatch' && github.event.action == 'backtest-report') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'backtest')
        env:
          BACKTEST_MONTH: ${{ github.event.client_payload.month || github.event.inputs.backtest_month }}
        run: |
          if [ -n "$BACKTEST_MONTH" ]; then
            python backtest.py --month "$BACKTEST_MONTH"
          else
            python backtest.py
          fi

      - name: List output files
        run: |
          echo "Generated files:"
          find reports/output -type f -name "*.md" 2>/dev/null || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-stock-report-${{ github.run_id }}
          path: reports/output/
          if-no-files-found: error

      - name: Generate Pages index
        run: |
          mkdir -p reports/output
          REPORTS=$(find reports/output -maxdepth 1 -name '*.md' -printf '%f\n' | sort -r)
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="zh-CN">'
            echo '<head><meta charset="UTF-8"><title>A-Stock 报告</title></head>'
            echo '<body>'
            echo '<h1>A-Stock 每日选股报告</h1>'
            echo '<ul>'
            for f in $REPORTS; do
              echo "<li><a href=\"$f\">$f</a></li>"
            done
            echo '</ul>'
            echo '<p>自动生成于 ${{ github.run_started_at }}</p>'
            echo '</body></html>'
          } > reports/output/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/output
          keep_files: true

      - name: Create GitHub Release
        # 仅在手动触发时创建 Release，避免每日自动运行产生大量 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: report-${{ github.run_id }}
          name: "A-Stock Report ${{ github.run_id }}"
          body: |
            自动生成报告

            - 类型：${{ github.event.action || github.event.inputs.report_type }}
            - 运行时间：${{ github.run_started_at }}

            报告文件见下方附件。
          files: reports/output/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 可选：邮件通知（需要配置 EMAIL_USERNAME 和 EMAIL_PASSWORD secrets）
      - name: Send email notification
        if: env.EMAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "A-Stock 报告已生成"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: github-actions@example.com
          body: |
            报告已生成完成。

            在线查看：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            Artifact 下载：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
